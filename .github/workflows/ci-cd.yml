name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

# Non-sensitive Azure deployment environment variables
env:
  RESOURCE_GROUP: rg-insightflow-ai
  ACR_NAME: aiprojectsdcr
  CONTAINER_APP_NAME: insightflow-ai
  IMAGE_NAME: insightflow-ai

jobs:
  # ==========================================
  # PHASE 1: CI (Continuous Integration)
  # ==========================================
  ci-checks:
    name: CI Checks (Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Checker
        run: uv run mypy src tests

      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ==========================================
  # PHASE 2: CD (Continuous Deployment via OIDC)
  # ==========================================
  cd-deploy:
    name: Deploy to Azure Container Apps
    needs: [ci-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server and access token
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.login_server }}
          username: "00000000-0000-0000-0000-000000000000"
          password: ${{ steps.acr.outputs.token }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
